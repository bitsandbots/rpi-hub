# Purpose: ZIM payload manifest. Lists the offline-library content set the
#          hub should serve. content/fetch.sh reads this on a workstation
#          to download files; content/verify.sh re-hashes against it.
# Unit:    n/a (data file consumed by fetch.sh and verify.sh)
# Phase:   3
#
# Tiers (controls which subset fetch.sh pulls):
#   minimal — fits on a 16 GB SD card; suitable for Pi Zero 2 W gift builds
#   core    — fits on 64 GB; sane default for Pi 4
#   full    — fits on 256 GB+ SSD; assistant-enabled build (Phase 6)
#
# The URLs below point at Kiwix's CDN. Kiwix rebuilds ZIMs on a rolling
# schedule, so the dated filenames here drift over time. To refresh: visit
# https://library.kiwix.org/, find the current file for each entry, and
# update both the `url` and the `sha256` (which can be left blank for a
# first fetch — fetch.sh will print the hash so you can lock it in).
#
# Note: WikiHow was pulled from Kiwix entirely (licensing). The minimal
# tier's how-to coverage now lives in the zimgit-* survival bundle plus
# ifixit (repair). Medical coverage in core uses WikEM (clinical) and
# zimgit-medicine (consumer-level) since the legacy medical_en_all_maxi
# build is no longer published.

version: 1

zims:
