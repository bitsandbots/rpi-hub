# Lint + test on every PR. Never downloads ZIMs or model weights.
# Phase introduced: 1
# v1.2.1 additions (GAP §7): qr-decoder job + bake-image-lint job.
name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # Per-package requirements land as they're added in later phases.
          # Phase 1 has no Python yet; this job is a no-op until Phase 5.
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run pytest if any tests exist
        run: |
          if find . -path ./.git -prune -o -name 'test_*.py' -print | grep -q .; then
            pytest -q
          else
            echo "No tests yet — skipping."
          fi

  # Closes GAP §7 row "No CI-side QR decoder check".
  # Round-trips the Ed25519 fingerprint QR through a real decoder (zbar)
  # after rasterising the SVG so we catch encoder regressions across
  # SVG renderers that a structural assertion would miss.
  qr-decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install zbar + cairo system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libzbar0 libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 shared-mime-info
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyzbar cairosvg pillow pytest qrcode segno cryptography
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run QR decoder round-trip test
        # continue-on-error until the matching test file lands (tracked
        # in GAP §5 — "QR encoder round-trip through a real decoder").
        continue-on-error: true
        run: |
          if [ -f mesh/rpi_pod_mesh/tests/test_qrcode_decode.py ]; then
            pytest -q mesh/rpi_pod_mesh/tests/test_qrcode_decode.py
          else
            echo "test_qrcode_decode.py not present yet — job is a placeholder."
            exit 1
          fi

  # Closes GAP §7 row "No image-bake validation in CI".
  # scripts/bake_image.sh is Linux-only and chroot-heavy; CI never actually
  # bakes an image. We do syntax + shellcheck so a typo in the bake script
  # is caught before it bricks an SD card.
  bake-image-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: bash -n scripts/bake_image.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          additional_files: bake_image.sh
          severity: warning
      - name: smoke-parse embedded heredocs
        run: |
          # Re-parse with `bash -n` once per heredoc-delimited block to
          # surface heredoc syntax issues that the top-level -n can miss.
          # No heredocs in v1.2.1 bake_image.sh, but this guards future drift.
          if grep -nE "<<[-]?'?[A-Z_]+'?" scripts/bake_image.sh; then
            echo "Heredoc(s) found; full-script bash -n already validated them."
          else
            echo "No heredocs in scripts/bake_image.sh."
          fi
