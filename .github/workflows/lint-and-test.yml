# Purpose: CI — pytest (blocking), pre-commit lint (report-only), frontend build (blocking).
# Unit:    n/a (GitHub Actions workflow)
# Phase:   n/a (workstation/CI tooling)
#
# Lint is intentionally non-blocking for now: the repo carries pre-existing
# ruff/black debt unrelated to any single change. Once that's cleaned up,
# flip lint's `continue-on-error` to false to make it a hard gate.

name: lint-and-test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install fastapi pydantic uvicorn numpy cryptography

      - name: Run pytest
        run: pytest

  lint:
    name: pre-commit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pre-commit/action@v3.0.1

  frontend-build:
    name: app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build
