# Purpose: CI — pytest (blocking), pre-commit lint (report-only), frontend build (blocking).
# Unit:    n/a (GitHub Actions workflow)
# Phase:   n/a (workstation/CI tooling)
#
# Lint is intentionally non-blocking for now: the repo carries pre-existing
# ruff/black debt unrelated to any single change. Once that's cleaned up,
# flip lint's `continue-on-error` to false to make it a hard gate.

name: lint-and-test

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install fastapi pydantic uvicorn numpy cryptography

      - name: Run pytest
        run: python -m pytest

  lint:
    name: pre-commit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pinned at latest (v3.0.1, confirmed 2026-07-02). This job will keep
      # showing a "Node.js 20 is deprecated" annotation because the action
      # itself pins actions/cache@v4 internally (see its action.yml) — not
      # something we control from this workflow. Upstream's own bump PR
      # (pre-commit/action#242, cache v4→v5) was closed without merging, and
      # main is still on v4 too, so there's no newer release to pick up.
      # Nothing to do here short of dropping pre-commit/action for a manual
      # install step, which isn't worth it for one cosmetic warning.
      - uses: pre-commit/action@v3.0.1

  frontend-build:
    name: app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build
