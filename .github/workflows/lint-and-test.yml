# Lint + test on every PR. Never downloads ZIMs or model weights.
# Phase introduced: 1
name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # Per-package requirements land as they're added in later phases.
          # Phase 1 has no Python yet; this job is a no-op until Phase 5.
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run pytest if any tests exist
        run: |
          if find . -path ./.git -prune -o -name 'test_*.py' -print | grep -q .; then
            pytest -q
          else
            echo "No tests yet — skipping."
          fi
