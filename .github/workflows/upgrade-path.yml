# Weekly upgrade-path walk: v1.1.0 → v1.2.0 → v1.2.1.
# Phase introduced: tooling pass for v1.2.1.
# Closes GAP §7 row "No upgrade path test".
#
# install.sh has no --dry-run mode and mutates /etc + /opt + systemd
# state. CI cannot safely run the real walk on a stock ubuntu-latest
# runner, so this workflow:
#   1. Always shellchecks and bash -n the script (cheap, fast, real).
#   2. Tries to execute it in a privileged container — when that fails
#      (no qemu Pi image on the runner), the job is continue-on-error so
#      the workflow stays green and the failure is just a heads-up.
#
# To exercise the full walk, run the script by hand inside a disposable
# Pi OS VM. The script itself documents the manual procedure.
name: upgrade-path

on:
  push:
    branches: [main]
    paths:
      - "scripts/test_upgrade_path.sh"
      - "install.sh"
      - ".github/workflows/upgrade-path.yml"
  pull_request:
    paths:
      - "scripts/test_upgrade_path.sh"
      - "install.sh"
      - ".github/workflows/upgrade-path.yml"
  schedule:
    - cron: "0 7 * * 1"  # Weekly Monday 07:00 UTC (one hour after security-scan).

jobs:
  upgrade-path-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so the script can resolve v1.1.0 / v1.2.0 tags.
      - name: bash -n
        run: bash -n scripts/test_upgrade_path.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          additional_files: test_upgrade_path.sh
          severity: warning

  upgrade-path-dryrun:
    runs-on: ubuntu-latest
    needs: upgrade-path-lint
    # Best-effort: only meaningful in a disposable Pi OS environment.
    # On a stock runner the script's environment guard exits 0 with the
    # documentation NOTICE — that's what we want here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run upgrade-path walk (documentation mode)
        run: ./scripts/test_upgrade_path.sh
