# Purpose: DHCP + DNS for SIGNAL clients on wlan0 (192.168.4.0/24).
# Unit:    signal-ap.service
# Phase:   1 (Phase 2 adds the wildcard DNS line for captive portal)
#
# Phase 1: hand out leases only — no wildcard DNS yet, so client DNS lookups
# will fail until Phase 2 lands the captive portal. That is intentional.

interface=wlan0
bind-interfaces
domain-needed
bogus-priv
no-resolv
no-hosts

# DHCP pool
dhcp-range=192.168.4.10,192.168.4.250,255.255.255.0,12h
dhcp-option=3,192.168.4.1     # default gateway
dhcp-option=6,192.168.4.1     # DNS server

# Friendly local name
address=/hub.local/192.168.4.1
local=/local/

# Phase 2 will add: address=/#/192.168.4.1
