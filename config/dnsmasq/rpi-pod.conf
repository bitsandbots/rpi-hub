# Purpose: DHCP + DNS for rpi-POD clients on wlan0 (192.168.4.0/24). DNS is
#          wildcarded to the AP itself so every name resolves to the captive
#          portal — that's what trips the OS connectivity check.
# Unit:    rpi-pod-ap.service
# Phase:   1 (wildcard DNS line added in Phase 2)

interface=wlan0
bind-interfaces
domain-needed
bogus-priv
no-resolv
no-hosts

# DHCP pool
dhcp-range=192.168.4.10,192.168.4.250,255.255.255.0,12h
dhcp-option=3,192.168.4.1     # default gateway
dhcp-option=6,192.168.4.1     # DNS server

# Friendly local name
address=/hub.local/192.168.4.1
local=/local/

# Phase 2: wildcard catch-all. Every hostname a client looks up resolves to
# the AP. Combined with nginx's default_server, this is what turns
# captive.apple.com / connectivitycheck.gstatic.com / msftconnecttest.com
# into a "Sign in to network" prompt on the client.
address=/#/192.168.4.1
