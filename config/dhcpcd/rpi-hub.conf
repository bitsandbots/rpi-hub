# Purpose: Pin wlan0 to a static IP so it can serve as an AP.
# Unit:    dhcpcd.service (consumed at /etc/dhcpcd.conf via install.sh)
# Phase:   1
#
# Appended to /etc/dhcpcd.conf by install.sh. Without this, dhcpcd will keep
# trying to DHCP on wlan0 and fight with hostapd.

interface wlan0
    static ip_address=192.168.4.1/24
    nohook wpa_supplicant
