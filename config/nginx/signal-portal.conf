# Purpose: Captive portal for SIGNAL. Two server blocks:
#            1. default_server — catches every probe (Host: captive.apple.com,
#               connectivitycheck.gstatic.com, www.msftconnecttest.com, …)
#               and 302s to the local portal. That non-Success / non-204 /
#               non-"Microsoft Connect Test" response is what tells the OS
#               "this is a captive network", which pops the sign-in sheet.
#            2. hub.local — serves the static landing page.
# Unit:    nginx.service
# Phase:   2
#
# Why two blocks instead of per-probe location rules: clients probe dozens
# of different hosts/paths and the list keeps growing. A blanket 302 from
# the default server is robust to whatever Apple / Google / Microsoft add
# next, as long as the probe is plain HTTP. HTTPS probes fail at the TLS
# layer (no cert for google.com on our box) and clients fall back to HTTP.

# Block 1: everything that isn't hub.local. Sends the device's CNA here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/signal-portal.access.log;
    error_log  /var/log/nginx/signal-portal.error.log;

    # Drop the request path on purpose: probe URLs are not pages we want to
    # serve, just signals that a client is here. Send them all to the root.
    return 302 http://hub.local/;
}

# Block 2: the actual portal.
server {
    listen 80;
    listen [::]:80;
    server_name hub.local;

    root /var/www/signal-portal;
    index index.html;

    access_log /var/log/nginx/signal-portal.access.log;
    error_log  /var/log/nginx/signal-portal.error.log;

    # Tight defaults for a tiny static site on a Pi Zero.
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Phase 4: long-lived static assets — fonts, CSS, JS. These never change
    # at runtime; safe to cache hard. nginx's default no-cache headers would
    # otherwise burn unnecessary bytes on every page load over Wi-Fi.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Phase 3: Kiwix offline library. kiwix-serve knows its own URL prefix
    # via --urlRootLocation=/library, so we pass the path through as-is
    # (no trailing slash on proxy_pass). When /var/lib/kiwix is empty the
    # signal-kiwix unit stays inactive and this block returns 502 — that's
    # the cue to run content/fetch.sh on a workstation.
    location /library/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Phase 4: status API surface, ready for Phase 5's signal-status unit on
    # 127.0.0.1:8000. The status page (status.html) consumes /api/status.
    # Until Phase 5 lands the upstream is down and clients see 502 — status.js
    # treats that as "service not running yet" and renders a calm banner
    # instead of broken metrics. This is the intended UX during the gap.
    #
    # The trailing slash on proxy_pass strips the /api/ prefix, so
    # /api/status hits the FastAPI app at /status.
    #
    # Phase 6 adds two siblings (assist on :8200, retrieve on :8100) under
    # dedicated location blocks below. Those have to be declared first
    # because nginx matches longest-prefix among prefix locations.
    location /api/ask {
        proxy_pass http://127.0.0.1:8200/ask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        # The Ask endpoint waits on llama.cpp; budget is ~10s end-to-end
        # but we give a little headroom to avoid 504 on cold cache.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }

    location /api/retrieve {
        proxy_pass http://127.0.0.1:8100/retrieve;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
    }

    # Phase 9A: notes board. Strip the /api prefix so /api/notes hits the
    # FastAPI app at /notes. POSTs are rate-limited inside the app; nginx
    # caps payload size at the server-level 1m which is plenty for 280
    # chars of UTF-8.
    location /api/notes {
        proxy_pass http://127.0.0.1:8400/notes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
    }

    # Phase 9B: printable field cards. PDFs land under
    # /var/www/signal-portal/print/ at install --pack time. Direct file
    # serve — no upstream needed. We keep cache headers off so a swapped
    # pack appears immediately on next reload.
    location /print/ {
        alias /var/www/signal-portal/print/;
        autoindex off;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # Don't let nginx hold the proxy connection open for a stopped unit.
        proxy_next_upstream off;
    }
}
