# Purpose: Disable IPv4 forwarding so the Pi can never route client packets
#          to another interface. Belt-and-braces with the iptables FORWARD
#          drop applied by rpi-pod-ap.service.
# Unit:    rpi-pod-ap.service (sysctl --system reload at install time)
# Phase:   1

net.ipv4.ip_forward=0
net.ipv6.conf.all.forwarding=0
