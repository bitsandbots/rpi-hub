# Purpose: Provision the shared RTL-SDR cross-process mutex. The single
#          USB dongle is contended by three independent units —
#          rpi-hub-listen (in-process Tuner: FM/GPS), rpi-hub-listen-same
#          (SAME pipeline), and dump1090-mutability. Each holds an
#          advisory flock on this file for as long as it owns the radio,
#          so they can never claim the dongle simultaneously.
# Unit:    consumed by rpi-hub-listen.service, rpi-hub-listen-same.service,
#          and the dump1090-mutability flock drop-in.
# Phase:   8 (mutex hardening)
#
# The lock file is world-writable (0666) because the consuming units run
# as distinct DynamicUser identities and all must be able to open it for
# the flock. It carries no data — only the advisory lock matters.
d /run/rpi-hub 0755 root root -
f /run/rpi-hub/rtlsdr.lock 0666 root root -
