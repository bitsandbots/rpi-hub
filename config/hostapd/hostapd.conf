# Purpose: Broadcast the RPI-POD-INFOHUB open SSID on wlan0.
# Unit:    rpi-pod-ap.service (via /etc/default/hostapd)
# Phase:   1
#
# Open network — no WPA2. Captive portal (Phase 2) is the only gate.
# Country code is the default; install.sh will overwrite this line if the
# environment variable RPI_POD_COUNTRY_CODE is set (e.g. RPI_POD_COUNTRY_CODE=CA).

interface=wlan0
driver=nl80211
ssid=RPI-POD-INFOHUB

hw_mode=g
channel=6
country_code=US
ieee80211d=1
ieee80211n=1
wmm_enabled=1

# Open mode — no auth, no encryption.
auth_algs=1
ignore_broadcast_ssid=0

# Reasonable client limits for a Pi Zero 2 W AP. Tune in field deployments.
max_num_sta=24
beacon_int=100
dtim_period=2
