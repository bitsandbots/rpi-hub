# Purpose: Make dump1090-mutability participate in the single-dongle
#          RTL-SDR mutex. Without this, dump1090 opens the dongle
#          directly and the in-process Tuner (FM/GPS) / SAME pipeline
#          have no way to know it is held — the blueprint's "single-dongle
#          mutex with SAME" would be unenforced at runtime.
# Unit:    drop-in for dump1090-mutability.service
# Phase:   8.4 (mutex hardening)
#
# We reset the packaged ExecStart and re-run the same launcher under
# `flock`, holding /run/rpi-hub/rtlsdr.lock for the daemon's lifetime.
# -n makes startup fail fast if another consumer already holds the dongle
# (systemd then retries per Restart=); the install-time enable gate keeps
# dump1090 and the SAME pipeline from both being enabled, so this is the
# belt-and-braces runtime guarantee.
[Service]
ExecStart=
ExecStart=/usr/bin/flock -n /run/rpi-hub/rtlsdr.lock /usr/share/dump1090-mutability/start-dump1090-mutability
