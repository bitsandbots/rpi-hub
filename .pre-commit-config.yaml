# Pre-commit hooks for rpi-hub.
# Phase introduced: 1 (scaffold lands with Phase 1)
# Run: `pre-commit install` once after clone; `pre-commit run --all-files` to lint everything.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
        # No ruff-format hook here: black is this repo's authoritative
        # formatter (pyproject.toml [tool.black], Makefile `fmt` target).
        # ruff-format and black disagree on some edge cases (comment
        # spacing, dataclass blank lines), so running both caused an
        # infinite reformat ping-pong between hook runs.

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: ["--strict", "--ignore-missing-imports", "--explicit-package-bases"]
        additional_dependencies: ["pydantic", "fastapi"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: ["-i", "4", "-ci"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          [
            "-d",
            "{extends: default, rules: {line-length: {max: 120}, document-start: disable}}",
          ]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint

  - repo: local
    hooks:
      - id: check-config-header
        name: rpi-hub config header required
        entry: scripts/check_config_header.py
        language: script
        files: ^config/.*\.(conf|yaml|yml)$
