# Purpose: Dev tooling config for the rpi-hub-status FastAPI app and any
#          future api/ subpackages (Phase 6+ assistant components live here
#          too). Runtime deps are installed on-device via apt (python3-fastapi,
#          python3-uvicorn) — this file is for local linting and tests.
# Unit:    n/a (workstation tooling)
# Phase:   5

[project]
name = "rpi-hub-api"
version = "0.5.0"
description = "rpi-hub on-device APIs (status, retrieve, assist)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient
    "ruff>=0.9,<1.0",
    "black>=25.1,<26",
    "mypy>=1.15,<2",
]

[tool.setuptools]
packages = ["rpi_hub_status"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["rpi_hub_status/tests"]
addopts = "-ra -q"
